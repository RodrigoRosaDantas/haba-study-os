<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111e">
    <meta name="description" content="HABA Study OS — ambiente de estudo local-first para BB + CAIXA TI.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'">
    <title>HABA Study OS · BB + CAIXA TI</title>
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=7">
    <script type="module" src="./src/app.js?v=8"></script>
  </head>
  <body>
    <a class="skip-link" href="#view-root">Pular para o conteúdo</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#today" aria-label="HABA Study OS, início">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M9 8v24M31 8v24M9 20h22M20 8v24"/><circle cx="20" cy="20" r="16"/></svg></span>
          <span class="brand-copy"><strong>HABA<span>OS</span></strong><small>BB + CAIXA TI</small></span>
        </a>
        <div class="topbar-center"><span class="live-dot"></span><span>STUDY SYSTEM</span><span class="topbar-divider">/</span><span id="top-cycle">CICLO CARREGANDO</span></div>
        <div class="topbar-actions">
          <span class="status-pill" id="network-status"><span class="status-led"></span><span>ONLINE</span></span>
          <button class="icon-button" id="quick-install" type="button" aria-label="Instalar aplicativo" title="Instalar aplicativo" hidden>↓</button>
          <button class="avatar" type="button" aria-label="Haba Study OS">H</button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar" aria-label="Navegação principal">
          <div class="sidebar-label">WORKSPACE</div>
          <nav class="primary-nav">
            <button class="nav-item is-active" data-route="today" aria-label="Centro de comando" title="Centro de comando"><span class="nav-icon">◈</span><span>Command Center</span><kbd>01</kbd></button>
            <button class="nav-item" data-route="study" aria-label="Estudar" title="Estudar"><span class="nav-icon">▤</span><span>Estudar</span><kbd>02</kbd></button>
            <button class="nav-item" data-route="questions" aria-label="Questões" title="Questões"><span class="nav-icon">⌘</span><span>Questões</span><kbd>03</kbd></button>
            <button class="nav-item" data-route="reviews" aria-label="Revisões" title="Revisões"><span class="nav-icon">⟳</span><span>Revision Engine</span><kbd>04</kbd></button>
            <button class="nav-item" data-route="errors" aria-label="Caderno de erros" title="Caderno de erros"><span class="nav-icon">⌁</span><span>Error Lab</span><span class="nav-count" id="error-count">0</span></button>
          </nav>
          <div class="sidebar-label sidebar-label-spaced">INTELLIGENCE</div>
          <nav class="primary-nav">
            <button class="nav-item" data-route="analytics" aria-label="Desempenho" title="Desempenho"><span class="nav-icon">▥</span><span>Analytics</span></button>
            <button class="nav-item" data-route="mentor" aria-label="Mentor" title="Mentor"><span class="nav-icon">✳</span><span>Decision Engine</span></button>
            <button class="nav-item" data-route="history" aria-label="Histórico" title="Histórico"><span class="nav-icon">◷</span><span>Histórico</span></button>
          </nav>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-card">
            <div class="sidebar-card-icon">◎</div>
            <div><strong>LOCAL FIRST</strong><span>Seu progresso fica neste dispositivo.</span></div>
          </div>
          <button class="nav-item settings-link" data-route="settings" aria-label="Configurações" title="Configurações"><span class="nav-icon">⚙</span><span>Configurações</span></button>
          <div class="sidebar-footer"><span class="version-dot"></span><span>HABA STUDY OS</span><span class="mono">v0.2</span></div>
        </aside>

        <main id="view-root" class="main-content" tabindex="-1" aria-live="polite">
          <section class="loading-state"><div class="loader-ring"></div><p>Inicializando ambiente de estudo…</p></section>
        </main>
      </div>

      <nav class="mobile-nav" aria-label="Navegação mobile">
        <button class="mobile-nav-item is-active" data-route="today"><span>◈</span><small>Hoje</small></button>
        <button class="mobile-nav-item" data-route="study"><span>▤</span><small>Estudar</small></button>
        <button class="mobile-nav-item" data-route="questions"><span>⌘</span><small>Questões</small></button>
        <button class="mobile-nav-item" data-route="reviews"><span>⟳</span><small>Revisar</small></button>
        <button class="mobile-nav-item" data-route="more"><span>•••</span><small>Mais</small></button>
      </nav>
    </div>
    <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
    <div id="update-banner" class="update-banner" role="status" aria-live="polite" hidden><span>Nova interface pronta. Atualize para aplicar.</span><button id="apply-update" class="button button-primary" type="button">Atualizar</button></div>
  </body>
</html>
